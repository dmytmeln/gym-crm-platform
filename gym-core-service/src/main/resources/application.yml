spring:
  application:
    name: gym-core-service
  profiles:
    active: local
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  liquibase:
    change-log: classpath:db/changelog/changelog-root.xml
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      port: 6379

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus"
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        gym.crm.search.duration.seconds: true
      percentiles:
        gym.crm.search.duration.seconds: 0.5, 0.9, 0.95, 0.99

server:
  servlet:
    context-path: /gym-crm/core
  port: 8080

app:
  api:
    base-path: /api/v1
  security:
    jwt:
      access-expiration-ms: 86400000
