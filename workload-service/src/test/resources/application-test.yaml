spring:
  activemq:
    broker-url: failover:(vm://localhost?broker.persistent=false)

eureka:
  client:
    enabled: false

logging:
  level:
    root: info

app:
  security:
    jwt:
      secret-key: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  jms:
