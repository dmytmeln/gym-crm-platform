spring:
  activemq:
    broker-url: ${ACTIVEMQ_BROKER_URL}
    user: ${ACTIVEMQ_USER}
    password: ${ACTIVEMQ_PASSWORD}
  data:
    mongodb:
      host: ${MONGO_HOST}
      port: ${MONGO_PORT}
      database: ${MONGO_DATABASE}
      username: ${MONGO_USERNAME}
      password: ${MONGO_PASSWORD}

eureka:
  client:
    service-url:
      defaultZone: ${DISCOVERY_SERVER_URL}
  instance:
    prefer-ip-address: true

app:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY}
  jms:
    queues:
      trainer-workload: staging.trainer.workload.updates
      trainer-workload-dlq: staging.trainer.workload.updates.dlq
    concurrency: 3-10
    redelivery:
      initial-delay-ms: 2000
      maximum-redeliveries: 5
      maximum-delay-ms: 30000
      back-off-multiplier: 2.0
      use-exponential-back-off: true
